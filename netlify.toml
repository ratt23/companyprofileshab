[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  VITE_API_BASE_URL = "https://graphicat.site/api"
  NODE_VERSION = "20"

[dev]
  command = "npm run dev"
  targetPort = 3007
  port = 8890
  framework = "#custom"
  autoLaunch = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false
